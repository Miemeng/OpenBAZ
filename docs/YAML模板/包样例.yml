# ============================================================
# 卡包 YAML 样例 v0.3 —— 核心卡包（core）
# 依据：《规则说明书 v0.10》《卡牌模拟器框架设计 v0.12》§4、《YAML数据格式规范.md》§5
# 用法：复制本文件为 packs/<pack_id>/pack.yml，按下文目录结构组织本包全部文件，
#       整目录打包为 <pack_id>.zip（zip 根目录即 pack.yml，不再多套一层文件夹）
# 校验：导入时逐一核对下方清单中的文件存在、卡牌 id 与文件名一致（规范 §10）
# ============================================================

# ---------- 卡包目录结构（v0.11 定稿） ----------
#
# packs/core/                    ← 包名目录 = 卡包 id
# ├── pack.yml                   ← 本文件（包定义）
# ├── rarities.yml               ← 品阶定义（仅自定义品阶包需要；模板见《稀有度YAML模板.yml》）
# ├── cards/                     ← 卡牌 yml：文件内 id = 文件名（去扩展名）
# │   ├── furnace_guard.yml
# │   └── ember_sprite.yml
# ├── skills/                    ← 技能 yml（无技能的包可省略本目录）
# │   ├── ember_oath.yml
# │   └── second_wind.yml
# └── images/                    ← 卡图 / 卡框 / 技能图标：png；卡框放本层，卡图与技能图标按 id 分二级目录
#     ├── cards/                 ← 卡牌贴图：文件名 = 卡牌注册 id.png
#     │   ├── furnace_guard.png
#     │   └── ember_sprite.png
#     └── skills/                ← 技能图标：文件名 = 技能注册 id.png
#         ├── ember_oath.png
#         └── second_wind.png

# ---------- 标识与版本（必填）----------

id: core                        # 卡包唯一 id：小写字母 + 数字 + 下划线，全局唯一；
                                # 导入更新判定依据：同 id 卡包按 version 比较新旧；须与包名目录一致
name: 核心卡包                  # 显示名（卡包选择界面）
version: 1                      # 卡包整体版本，≥1 递增；与单卡 version 独立（规范 §10）
description: 内置示例卡包，含火系守卫与基础技能   # 简介，卡包选择界面小字
engine_range: [0.10]                # 引擎版本范围，

# ---------- 来源与分发（选填）----------

# author: RW                    # 作者名
# license: CC-BY-NC-4.0        # 许可协议（DIY 分享卡包建议填写）
# homepage: https://example.com/core   # 主页 / 更新源，客户端可据此检查新版本
# checksum: sha256:xxxx         # 整包校验和，防下载损坏；客户端解压前校验
# created_at: 2026-10-03        # 首次发布日期（YYYY-MM-DD）
# updated_at: 2026-10-03        # 本次更新日期

# ---------- 品阶 ----------

rarities:
  source: builtin               # 不写则默认使用引擎内置 bronze/silver/gold/diamond（规则 §13）；
                                # 自定义品阶包：省略本字段，改为在包根放置 rarities.yml
                                # （模板见《稀有度YAML模板.yml》，定义与合成关系均在其中）

# ---------- 内容清单（必填）----------

# 卡牌清单：导入时核对同 id YAML 文件（cards/<id>.yml）与 PNG 贴图（images/cards/<id>.png）
cards:
  - furnace_guard
  - ember_sprite

# 技能清单：规则同 cards，对应 skills/<id>.yml 与 images/skills/<id>.png；无技能写 []
skills:
  - ember_oath
  - second_wind



# ---------- 说明 ----------
# 1. 阵容（decks/）不随卡包分发：decks 引用卡包内的卡与技能，由客户端本地组织，也可导入，需校验卡包。
# 2. 导入流程：解 zip → 校验 pack.yml 必填字段 → 按清单核对文件与 id →
#    逐卡走 schema 校验（规范第 9 节）→ 注册进热加载注册表；任一失败即整包回滚并报告定位。
# 3. 自定义品阶包：定义和合成关系均在包内 rarities.yml 中定义（规则 §13）。
