# ============================================================
# 卡牌 YAML 填写示例 v0.3.5 —— 熔炉守卫（演示全部字段）
# 依据：《规则说明书 v0.9》《卡牌模拟器框架设计 v0.10》§6
# 格式约定与分区顺序与《卡牌YAML模板.yml》v0.3.4 保持一致
# 书写规则：abilities / enchant 内不写硬数值，数值型参数一律引用 stats 字段
# ============================================================

# ---------- 基础信息（必填）----------

id: furnace_guard      # 唯一 id：小写字母 + 数字 + 下划线，全局唯一，必须与文件名一致，卡牌贴图格式为png，同唯一id相同
name: 熔炉守卫
version: 1
size: medium           # medium=2格
cooldown: 4.50         # 冷却时间（单位：s）：行动条充满周期，即主动行动间隔
rarity: gold           # 品阶 id，表示这张卡的最低品质

# ---------- 扩展信息（选填）----------

description: 中体型火系守卫，持续灼烧对手，危急时充能自救并修复友军   # 卡牌描述（设计风味），小字显示在悬浮窗内
# slots: 2             # 选填：覆盖 size 推导的占位格数，≥1
owner: hero_forge      # 卡牌归属角色 id
frame: forge_frame     # 自定义卡框资源 id，缺省用品阶默认卡框

# ---------- 数值 ----------

stats:
# speed: 1.0           # 行动条速度，默认为1，一般不修改（受加速×2 / 减速×0.5 / 冰冻=0 影响）
  atk: 38              # 攻击数值：可被 { ref: self.atk } 引用、可被 buff；**不内置普攻**，伤害须由效果条目显式声明
  bur: 15              # 燃烧数值：主动效果施加的灼烧层数
  fre: 3.00            # 冰冻时长（单位：s）
  chg: 2.00            # 充能秒数：被动效果的 charge 推进量
  ena: 6               # 附魔加成：附魔效果的攻击增量
# shd: 10              # 护盾数值
# hel: 10              # 治疗数值
# poi: 1               # 剧毒数值
# reg: 1               # 再生数值
# has: 1.00            # 加速时长（单位：s）
# sol: 1.00            # 减速时长（单位：s）

# ---------- 经济（均选填；缺省由价值定义文件获取，见规则 §16） ----------

buy_prize: 220         # 买入价值
prize: 220             # 当前售价（模拟模式战斗内不变价）

# ---------- 多重触发（选填） ----------

multicast: 2           # 行动条充满后主动行动 2 次；卡面标注 *2

# ---------- 标签（选填） ----------

tags: [机械, 火系]
hidden_tags: [shield_source]

# ---------- 能力列表 ----------

abilities:

  # 主动效果：行动条充满即触发，灼烧敌方玩家
  #（灼烧为引擎内置周期效果：每 0.5s 造成 bur 层点伤害、先扣护盾，结算后层数 -20%）
  - id: 1                # 卡内唯一 id，供 inherit_override 按 id 定位覆盖
    kind: active
    actions:
      - do: gainStat
        stat: burn
        amount: self.bur     # 引用 stats.bur
        target: enemyPlayer

  # 主动效果（everyN：每第 3 次主动行动），冰冻随机敌方卡牌
  - id: 2
    kind: active
    everyN: 3               # 结构性参数，允许字面量
    actions:
      - do: applyStatus
        status: freeze
        target: { pick: randomEnemyCard }
        duration: { mul: [self.fre, 5] }   # 秒→tick：0.2s/tick，引用 stats.fre

  # 被动（优先级 20）：己方玩家血量低于 35% 时，充能自己并修复被摧毁的友军
  - id: 3
    kind: passive
    priority: 20
    trigger: { event: onPlayerDamaged }     # 玩家受伤时（敌我均广播）
    condition:
      all:
        - { cmp: eq, left: { var: player }, right: { ref: ownPlayer } }      # 仅己方玩家
        - { cmp: lt, left: { ref: ownPlayer.hpPct }, right: 0.35 }           # 阈值字面量允许
    actions:
      - do: charge
        target: self
        seconds: self.chg  # 引用 stats.chg；单次推进最多触发一次主动行动
      - do: repair
        target: { pick: allOwnCards }   # 重置被摧毁的卡牌（destroyed → false）

# ---------- 附魔（选填） ----------

# 附魔可自定义且需逐条定义，写在本卡设定文件中（规则 §18.7）
# 一张卡同时至多一个附魔，新附魔覆盖旧的（v0.8 决议）
enchant:
  - do: gainStat
    stat: atk
    amount: self.ena   # 引用 stats.ena
    target: self

# ---------- 品质继承（选填；规则 §13 v0.9） ----------

# 本卡最低品阶为 gold：卡面数值即黄金段基础值，只需补钻石段（到最高品阶为止每阶一段）。
# stats 为增量：钻石段 atk = 38 + 19 = 57；被动 id 3 阈值 35% → 50%
inherit_override:
  - rarity: diamond
    stats: { atk: 19 }  # 增量 +19
    abilities:
      - id: 3             # condition / actions 需全写，kind 沿用被覆盖条目
        condition:
          all:
            - { cmp: eq, left: { var: player }, right: { ref: ownPlayer } }
            - { cmp: lt, left: { ref: ownPlayer.hpPct }, right: 0.5 }
        actions:
          - do: charge
            target: self
            seconds: self.chg
          - do: repair
            target: { pick: allOwnCards }
