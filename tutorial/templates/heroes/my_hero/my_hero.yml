# 角色定义模板（复制 → 改名成 <角色id>.yml）；字段定义见《YAML数据格式规范.md》§11

# ---------- 标识（必填）----------
id: my_hero          # 必须与目录名、文件名一致；**同时是卡包 owner 的取值锚点**
name: 我的角色        # 显示名：卡面归属角标、悬浮窗信息条、摆盘界面都用它
version: 1           # 每次修改任意字段 +1

# ---------- 基础数值（必填）----------
init_hp: 300         # 初始血量
# init_max_hp: 300   # 选填：血量上限；缺省 = init_hp（填了才能做"开局不满血"的角色）
# levelup_max_hp: [100, 200, 300, 400]
#                    # 选填：第 n 项 = 升到第 (n+1) 级时提升的**上限**（只提上限，当前血量不跟着涨）
# 开局护盾：**不设**（RW 决议移除 init_shield）

# ---------- 拥有的卡包 / 技能包（选填，仅校对用）----------
owned_packs:         # 该角色可购买 / 拥有的**卡包** id
  - my_pack
# owned_skill_packs: [my_skill_pack]   # 该角色可购买 / 学习的**技能包** id
# 归属的唯一真相在卡包 / 技能自己的文件里：冲突时**以卡包为准**并提示"角色定义有误"。

# ---------- 展示（选填）----------
