# ============================================================
# 角色模板（**完整档**：每个字段都写出来，按需删改）
# 复制 → 改名成 <角色id>.yml；**目录名 / 文件名 / 文件内 id 三者必须逐字一致**（本模板 myHero）
# 字段定义见；命名口径：**字段名与 id 都是驼峰**
# ============================================================

# ---------- 标识（必填）----------
id: myHero               # 必须与目录名、文件名一致；**同时是卡包 owner 的取值锚点**
name: 我的角色            # 显示名：卡面归属角标、悬浮窗信息条、摆盘界面都用它
version: 1               # ≥1；每次修改任意字段 +1

# ---------- 基础数值（必填）----------
initHp: 300              # 初始血量（一场冒险开始时）
initMaxHp: 300           # 血量上限；缺省 = initHp（填了才能做"开局不满血"的角色）
levelupMaxHp: [100, 200, 300, 400]
                         # 升级提升的**上限**：第 n 项 = 升到第 (n+1) 级时 +该值
                         #   只提上限、当前血量不跟着涨；不填则升级不提升上限
# 开局护盾：**不设**（决议移除 init_shield）

# ---------- 展示 / 资源（选填）----------
description: 示例角色
# ★ 角色**只有这 8 个字段**：id / name / version / initHp / initMaxHp / levelupMaxHp / description
#   —— `tags`、`ownedSkillPacks`、`ownedPacks` **均已删除**：
#   归属的真相在**卡包 pack.yml** 与**卡牌自己写的 owner**里；技能归属在**技能自己的 heroes** 里。
# 头像（必填）：images/heroes/myHero/avatar.png      ← **文件名固定 avatar.png**
# 立绘（选填）：images/heroes/myHero/portraits/*.png ← 任意 png
#   —— 两者都在**包内** images/heroes/<hero_id>/ 下，与角色定义文件不同层
#**读取层不校验图片是否存在**，缺头像时客户端用缺省头像
