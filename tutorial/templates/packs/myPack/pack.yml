# ============================================================
# 卡包定义（**完整档**：每个字段都写出来，按需删改）
# 复制本目录 → 改名成你的包 id（**目录名 = 文件内 id**），本文件即 pack.yml
# 字段定义见《YAML 数据格式规范》
# 命名口径：**字段名与 id 都是驼峰**；而**封闭词表的值仍小写下划线**（deal_damage / enemy_player …）
# ============================================================

# ---------- 标识与版本（必填）----------
id: myPack               # 必须与目录名逐字一致（本目录就叫 myPack）
name: 我的卡包            # 显示名（卡包选择界面）
version: 1               # 卡包整体版本；与单卡 version 独立
description: 示例卡包      # 选填：卡包选择界面小字

# ---------- 内置标记（选填）----------
builtin: false           # 缺省 false = 玩家包；true = **随程序分发的内置包**
                         #   （只有随程序分发的内容包才写 true，例如基础包 base）
                         #   基准包与玩家包同放 packs/ 下、**不设只读分离**，供加载器 / 商店 / 前端识别

# ---------- 归属（选填，建议写）----------
owner: common            # 本包内**卡牌**的默认归属（三态）：
                         #   <hero_id> = 归属该角色（取值须与 heroes/<hero_id>/<hero_id>.yml 的 id 一致）
                         #   common    = 普通包 / 普通池：所有角色都可用
                         #   省略      = 未定义卡包：不属任何角色、也不进普通池
                         #   ★ 卡牌自己写了 owner ⇒ **以卡牌自己的为准**，与包不一致只报一条 note；
                         #     卡牌没写 ⇒ 加载期补齐为本字段
                         #   归属只是**商店售卖策略**，引擎不据此过滤；**技能不受本字段约束**

# ---------- 引擎版本（必填）----------
engineRange:              # 兼容的引擎版本**区间列表**（至少 1 项；缺省左闭右开）
  - from: '0.1.0'         #   基线：引擎 0.1.0 起（无上界）；正式版确认为 1.0.0
    # to: '1.0.0'         #   上界（不含）；省略 = 无上界
    # fromInclusive: false  #  显式改开闭：默认 from 含、to 不含；toInclusive: true 可把上界变含
                         #   ★ 版本号一律写全三段 major.minor.patch **并加引号**（不加引号会被 YAML 读成数字）

# ---------- 来源与分发（选填；**引擎不读**，供前端 / 分发识别）----------
author: 你的名字           # 作者名
license: CC-BY-NC-4.0    # 许可协议（DIY 分享卡包建议填写）
homepage: https://example.com/my-pack   # 主页 / 更新源，客户端可据此检查新版本
checksum: sha256:xxxx    # 整包校验和：**算法 = SHA-256，覆盖面 = 整包 zip 的字节流**（客户端解压前校验）
createdAt: 2026-10-03    # 首次发布日期（YYYY-MM-DD）
updatedAt: 2026-10-03    # 本次更新日期

# ---------- 品阶（选填）----------
# 不写 ⇒ 用引擎内置四档（bronze / silver / gold / diamond）与其**内置兜底价值**。
# 需要自定义品阶 / 覆盖价值时：在包根放 rarities.yml，并改为
rarities:
  source: builtin        #   builtin = 用引擎内置品阶表（缺省）；file = 用包根 rarities.yml
                         #   ⚠️ 价值（value / prize）挂在品阶上；自定义品阶**不得进入 upgrade 合成链**
                         #   （file 模式的模板见 packs/base/rarities.yml）

# ---------- 内容清单（至少写一条：cards 或 skills）----------
cards:                   # 卡牌清单：**裸文件名**（不带 .yml），每个 id = cards/<id>.yml = 卡内的 id
  - myCard
skills:                  # 技能清单：**裸文件名**（不带 .yml），每个 id = skills/<id>.yml = 技能内的 id
  - mySkill              # ★ 技能与卡牌写在**同一份** pack.yml 里（技能不再单独一份 pack.yml）
                         #   技能自身的 heroes 列表决定"谁能买"；技能包没有 owner

# ---------- 表现层资源清单（选填）----------
assets: []
                         # 表现层资源清单（缺省空 = 全部按文件名约定解析）；缺失不阻塞：
                         #   卡图 images/cards/<id>.png · 技能图标 images/skills/<id>.png
                         #   角色头像 images/heroes/<hero_id>/avatar.png · 立绘 .../portraits/*.png

# ---------- 依赖（选填）----------
dependencies: []         # 依赖缺失时卡包标记"不完整"、对应卡不可上阵（读取层本轮不解析，只记一条 note）
