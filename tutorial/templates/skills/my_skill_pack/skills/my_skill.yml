# 技能模板（复制 → 改名成 <技能id>.yml）；字段定义见《YAML数据格式规范.md》§4

# ---------- 基础信息（必填）----------
id: my_skill         # 必须与文件名一致
name: 我的技能
version: 1           # 每次修改任意字段 +1

# ---------- 扩展信息（选填）----------
icon: my_skill       # 头像两侧圆形图标资源 id；不写用默认图标
priority: 5          # 与卡牌被动同台比较，1–10；同优先级时技能后结算

# ---------- 归属（技能的唯一归属来源；**必填、不可省略**）----------
heroes:              # ★ 本技能可被哪些英雄购买 / 学习；须与角色文件 id 一致
  - my_hero
# 所有英雄都可用 → 写 common
# 所有英雄都不可用（特殊情况下获得，如活动 / 掉落 / 彩蛋）→ 写 sp
# 也可混写，如 heroes: [common, my_hero]（等价于 common）；common / sp 是保留字，不是英雄 id

# ---------- 数值（技能效果数值的唯一来源）----------
stats:
  shd: 20            # actions 里一律用 self.shd 引用，不写硬数值

# ---------- 触发（选填）----------
# 写了 → 只在匹配事件的触发帧结算，且**同一触发帧内至多结算一次**；
# 不写 → 不走事件匹配，按**每个触发帧至多结算一次**处理（纯光环类技能就是这种）。
# 技能**无冷却**。详见《战斗模拟设计.md》§5.3。
trigger: { event: battle_start }

# ---------- 效果列表（必填，至少 1 条）----------
actions:
  - do: shield
    target: own_player
    amount: self.shd
