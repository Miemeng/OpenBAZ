# 技能包定义模板（复制本目录 → 改名 → 改内容）；字段定义见《YAML数据格式规范.md》§5.1

id: my_skill_pack        # 必须与目录名一致
name: 我的技能包          # 显示名
version: 1               # 每次修改任意字段 +1
description: 示例技能包    # 选填

# ★ 技能包**没有 owner**：它不规定英雄，只是技能合集的分发单位；
#   技能归属由每个技能文件自己的 heroes 列表声明（可多个英雄）。
# ⚠️ 卡包专属字段（owner / cards / rarities）在技能包里都不适用。
