# 卡牌模板（复制 → 改名成 <卡牌id>.yml）；完整字段见《卡牌YAML模板.yml》，此处只留最小可用集

# ---------- 基础信息（必填）----------
id: my_card          # 必须与文件名一致；小写字母 + 数字 + 下划线
name: 我的卡牌
version: 1           # 每次修改任意字段 +1
size: small          # small = 1格 / medium = 2格 / large = 3格
cooldown: 5.00       # 冷却（秒）；-1 = 纯被动物品（没有行动条，不主动行动）
rarity: bronze       # 最低品阶；引用 rarities.yml（bronze / silver / gold / diamond）

# ---------- 扩展信息（选填）----------
description: 一张示例卡
# slots: 2           # 覆盖 size 推导的占位格数
# frame: my_frame    # 自定义卡框资源 id
# ⚠️ 归属**不在这里写**：由所属卡包 pack.yml 的 owner 决定，加载期自动补齐

# ---------- 数值（供 actions 引用；abilities 里不写硬数值）----------
stats:
  atk: 10
# speed: 1.0 / cdp: 100.0 / shd / hel / bur / poi / reg / has / sol / fre / chg …见完整模板

# ---------- 标签（选填）----------
tags: []             # 类型标签，供"每有一个X"类效果计数
hidden_tags: []      # 隐藏词条：不显示在卡面

# ---------- 能力列表 ----------
abilities:
  - id: 1            # 本卡内唯一
    kind: active     # 主动：行动条充满时按书写顺序结算（主动效果没有 trigger，冷却就是行动条）
    actions:
      - do: deal_damage
        target: random_enemy_card
        amount: self.atk

  - id: 2
    kind: passive    # 被动：时机词 + 选填条件 + 动作（时机词见《时机表.md》）
    priority: 5      # 1–10，数值大者优先；同优先级按加载顺序
    trigger: { event: on_player_damaged }
    actions:
      - do: gain_stat
        stat: atk
        amount: 2
        target: self

