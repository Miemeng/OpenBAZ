# 卡包定义模板（复制本目录 → 改名 → 改内容）；字段定义见《YAML数据格式规范.md》§5

id: my_pack              # 必须与目录名一致
name: 我的卡包            # 显示名（卡包选择界面）
version: 1               # 每次修改任意字段 +1；与单卡 version 独立
description: 示例卡包      # 选填：卡包选择界面小字

owner: common            # ★ 本包唯一的归属，包内**所有卡牌强制跟随**
                         #   <hero_id> = 归属该角色（取值须与 heroes/<hero_id>/<hero_id>.yml 的 id 一致）
                         #   common    = 普通包 / 普通池：所有角色都可用
                         #   省略      = 未定义卡包：不属任何角色、也不进普通池
                         #   与角色定义冲突时：以本字段为准，并提示"角色定义有误"

engine_range: [0.10]     # ⚠️ 待定：现有样例写 engine_range: [0.10]，规范 §5 字段表写 engine_min

cards:                   # 内容清单：每个 id 都要有 cards/<id>.yml 与 images/cards/<id>.png
  - my_card

# rarities:              # 需要自定义品阶时，改为在包根放 rarities.yml（模板见 docs/YAML模板/稀有度YAML模板.yml）
#   source: builtin

# ⚠️ 本段作废（v0.11 起）：卡包不再承载技能，技能走独立技能包 → skill_packs/<pack_id>/
