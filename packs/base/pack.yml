# 卡包定义 —— 基础规则包（base）
#
# 定位：**基础规则与数值的权威落点**，随程序分发；`core` 包只用来临时调数值、内容与数值都不是最终态。
# 本包当前**只承载品阶与卡牌价值的默认表**（`rarities.yml`），不含卡牌 / 技能 / 角色。
#
# 口径来源： ``（RW：「最终应当放在 packs/base 目录下，作为基础规则，core 包暂时用来调整，
#   引擎也内置一个兜底吧，防止基础包被改动出现问题」）。

id: base
name: 基础规则包
version: 1
description: 品阶与卡牌价值的默认表（基础规则）；引擎另有一份内置兜底，防止本包被改动后经济崩掉

builtin: true             # 随程序分发的内置包（缺省 false = 玩家包）

engineRange:              # 兼容的引擎版本区间列表（缺省左闭右开）
  - from: '0.0.0'

# 品阶与卡牌价值的默认表放在同目录 rarities.yml（本包的核心内容）
rarities:
  source: file

# ⚠️ 本包**不含** cards / skills / heroes（清单留空即可通过校验）
cards: []
skills: []
