# 内容包定义 —— 基础内容包（base）
#
# 定位：**基础内容与数值的权威落点**，随程序分发。
# 内容：① `rarities.yml`（品阶 + 卡牌价值）② **6 张基础卡**（无触发器 / 单一触发器，教程用它当例子）
#       ③ **2 个基础角色**（`heroes/thief` 盗贼 · `heroes/guard` 守卫 —— 没有角色客户端开不了局）。
#
# 口径来源：《规则说明书.md》（规则口径唯一来源）。

id: base
name: 基础内容包
version: 3               # v3（2026-10-20）：功能卡去掉 atk；品阶兜底价值改 1/2/4/8
description: 品阶与价值表 + 6 张基础卡 + 2 个基础角色；桌面版首次启动就是这一包，可直接开一局

builtin: true             # 随程序分发的内置包（缺省 false = 玩家包）

engineRange:              # 兼容的引擎版本区间列表（缺省左闭右开）
  - from: '0.0.0'

# 品阶与卡牌价值的默认表放在同目录 rarities.yml
rarities:
  source: file

# 卡牌清单：裸文件名 = cards/<id>.yml = 卡内的 id
cards:
  - plainSword           # 青铜 · 小 · 只有一条主动（伤害）
  - oldMachete           # 青铜 · 小 · 两条主动（伤害 + 自身攻击 +3）
  - herbBottle           # 白银 · 中 · 只有一条主动（治疗）
  - shelter              # 白银 · 中 · 只有一条主动（护盾）
  - maintainPack         # 黄金 · 中 · **纯光环**（己方全体 攻击 +10 / 护盾 +10）
  - treeHouse            # 钻石 · 大 · 一条主动（护盾）+ 一个被动（受伤回血）

# 角色不需要在这里列：读取层按目录扫描 heroes/<hero_id>/<hero_id>.yml
skills: []
