# 战地医师（fieldMedic）· 中 · 白银**纯被动卡**（`cooldown: -1`）
#
# 覆盖：`cooldown: -1`（无行动条、不主动行动 —— 唯一合法的"纯被动物品"写法）·
#       被动 `priority` + `trigger` + `condition` · `heal_player` · `gain_stat`（`regen`）·
#       **`repair`**（修复被 `destroy` 失效的相邻卡；`adjacent_to_self` 选择器）
id: fieldMedic
name: 战地医师
version: 1
size: medium
cooldown: -1             # -1 = 纯被动物品：无行动条、不主动行动
rarity: silver
description: 机制卡：自己一方每次受伤就治疗，并修复相邻的失效卡

stats:
  atk: 5                # 纯被动卡也必须有 atk（卡面必填），但它不会被打出来
  heal: 15
  regen: 3
  value: 3

tags: [human]

abilities:
  - id: 1
    kind: passive
    priority: 8          # 高于 bastionSmith 的 4：验证"数值大者先触发"
    trigger: { event: on_player_damaged }
    condition:
      cmp: lt
      left: { ref: own_player.hp_pct }
      right: 1           # 只要不满血就治（受伤事件本身已经过滤过一次）
    actions:
      - do: heal_player
        target: own_player
        amount: { ref: self.heal }
      - do: gain_stat
        stat: regen                # 玩家侧只认 DOT 名 burn / poison / regen（卡面键与 DOT 名同名）
        amount: { ref: self.regen }
        target: own_player
      - do: repair
        target: adjacent_to_self   # 修复相邻卡（对未被 destroy 的卡是空操作）
