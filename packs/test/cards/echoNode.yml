# 回声节点（echoNode）· 小 · 白银 —— **九词探针卡**（被动动作全部空转）
#
# 覆盖：`on_card_destroyed` · `on_card_repaired` · `on_card_frozen` · `on_card_hasted` ·
#       `on_card_slowed` · `on_card_charged`（**卡牌侧六词**）
#     + `on_burn_tick` · `on_poison_tick` · `on_regen_tick`（**持续效果跳变三词**，玩家侧事件，
#       卡牌被动同样能听；条件用 `player` 限定本方跳变）
#
# ⚠️ 整张卡挂在 **B 方**是刻意的：本包唯一会 `destroy` 的是 B 方的 `bastionSmith`，
#   它只挑**敌方卡** ⇒ 挂在 B 方的探针永远不会被它打掉。
#   （同包的 `echoProbe` 挂在 A 方，实测 t=8 就被打掉、漏掉过一次观察 —— 见 `skills/echoBreak.yml`。）
#
# ⚠️ 六条被动的动作一律 `gain_stat cdp 0`（**纯空转**）：`cdp` 修正**不参与**行动条周期
#   （`actionPeriodCs` 只读卡面基础 `stats.cdp`）⇒ 零影响；且 `gain_stat` 不产生任何**卡牌侧**
#   事件，探针不会把自己再喂一遍。**不能**拿 `repair` / `charge` / `apply_status` 当空转动作
#   —— 那三个正是本卡要观察的词。
#
# ⚠️ 只有 7 号能力真的动状态：`on_card_hasted` 在本包里没有别的生产者
#   （`ashRunner` / `ironWall` 的加速在它们第一次行动之前就被 `destroy` 掉了），
#   故由探针给自己上一层 **1 秒**加速 —— 一次主动行动只上一层，影响有界。
#
# 四条带数值的条件都**引用该时机词的专属参数**：参数缺失时求值会直接抛错中止整局。
id: echoNode
name: 回声节点
version: 1
size: small
cooldown: 2.00           # 只为让 7 号能力有机会行动（2 秒一次，一局约 2–3 次）
rarity: silver
description: 机制卡：六个卡牌侧时机词的广播探针（被动空转；仅自带一层 1 秒加速）

stats:
  atk: 1                 # 卡面必填；本卡不靠它输出
  cdp: 100.0
  haste: 1.00            # 7 号能力的加速时长（秒）
  value: 3

tags: [construct]

abilities:
  - id: 1                # on_card_destroyed：专属参数 card / slot_index
    kind: passive
    trigger: { event: on_card_destroyed }
    condition:
      cmp: gte
      left: { var: slot_index }
      right: 0
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 2                # on_card_repaired：专属参数 card / slot_index
    kind: passive
    trigger: { event: on_card_repaired }
    condition:
      cmp: gte
      left: { var: slot_index }
      right: 0
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 3                # on_card_frozen：专属参数 card / duration（秒）
    kind: passive
    trigger: { event: on_card_frozen }
    condition:
      cmp: gt
      left: { var: duration }
      right: 0
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 4                # on_card_hasted：专属参数 card / duration（秒）
    kind: passive
    trigger: { event: on_card_hasted }
    condition:
      cmp: gt
      left: { var: duration }
      right: 0
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 5                # on_card_slowed：专属参数 card / duration（秒）
    kind: passive
    trigger: { event: on_card_slowed }
    condition:
      cmp: gt
      left: { var: duration }
      right: 0
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 6                # on_card_charged：专属参数 card / amount（秒）
    kind: passive
    trigger: { event: on_card_charged }
    condition:
      cmp: gt
      left: { var: amount }
      right: 0
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 7                # 唯一真的动状态的一条：给自己一层 1 秒加速（`on_card_hasted` 的生产者）
    kind: active
    actions:
      - do: apply_status
        target: self
        status: haste
        seconds: { ref: self.haste }

  # —— 以下三条是**持续效果跳变**侧（玩家侧事件，卡牌被动同样能听）——
  # 条件里的 `player` 限定"本方的跳变"、`stacks` / `damage` / `heal` 用来证明这三个参数确实随广播给出。
  - id: 8                # on_burn_tick：player / stacks（结算前层数）/ damage
    kind: passive
    trigger: { event: on_burn_tick }
    condition:
      all:
        - { cmp: eq, left: { var: player }, right: { ref: own_player } }
        - { cmp: gte, left: { var: stacks }, right: 0 }
        - { cmp: gte, left: { var: damage }, right: 0 }
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 9                # on_poison_tick：player / stacks / damage
    kind: passive
    trigger: { event: on_poison_tick }
    condition:
      all:
        - { cmp: eq, left: { var: player }, right: { ref: own_player } }
        - { cmp: gte, left: { var: stacks }, right: 0 }
        - { cmp: gte, left: { var: damage }, right: 0 }
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self

  - id: 10               # on_regen_tick：player / stacks / heal（再生走 `heal`，不是 `damage`）
    kind: passive
    trigger: { event: on_regen_tick }
    condition:
      all:
        - { cmp: eq, left: { var: player }, right: { ref: own_player } }
        - { cmp: gte, left: { var: stacks }, right: 0 }
        - { cmp: gte, left: { var: heal }, right: 0 }
    actions:
      - do: gain_stat
        stat: cdp
        amount: 0
        target: self
